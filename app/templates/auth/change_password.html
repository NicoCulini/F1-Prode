{% extends "base.html" %}
{% block title %}Account Settings — F1 Prode{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-5 col-lg-4">
    <h4 class="page-title mb-1">Account Settings</h4>
    <p style="color:var(--text-2);font-size:.875rem;margin-bottom:2rem">{{ current_user.username }}</p>

    <div class="card mb-3">
      <div class="card-header">Change username</div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_username') }}">
          <div class="mb-4">
            <label class="form-label">New username</label>
            <input type="text" name="username" class="form-control"
                   value="{{ current_user.username }}" minlength="3" autofocus required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Update username</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Change password</div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label">Current password</label>
            <input type="password" name="current" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Update password</button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
