{% extends "base.html" %}
{% block title %}Sign in — F1 Prode{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-5 col-lg-4">
    <h4 style="font-family:'Titillium Web',sans-serif;font-weight:700;margin-bottom:.25rem">Sign in</h4>
    <p style="color:var(--text-secondary);font-size:.875rem;margin-bottom:1.75rem">Welcome back.</p>

    <div class="card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Sign in</button>
        </form>
      </div>
    </div>

    <p style="text-align:center;color:var(--text-muted);font-size:.82rem;margin-top:1.25rem">
      No account? <a href="{{ url_for('auth.register') }}">Join now</a>
    </p>
  </div>
</div>
{% endblock %}
