{% extends "base.html" %}
{% block title %}Reset password — F1 Prode{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-5 col-lg-4">
    <h4 class="page-title mb-1">Reset password</h4>
    <p style="color:var(--text-2);font-size:.875rem;margin-bottom:2rem">{{ username }}</p>

    <div class="card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="new_password" class="form-control" minlength="6" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Set new password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
