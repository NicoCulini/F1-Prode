{% extends "base.html" %}
{% block title %}Account Settings — F1 Prode{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-5 col-lg-4">
    <h4 class="page-title mb-1">Account Settings</h4>
    <p style="color:var(--text-2);font-size:.875rem;margin-bottom:2rem">{{ current_user.username }}</p>

    <div class="card mb-3">
      <div class="card-header">Profile picture</div>
      <div class="card-body p-4">
        <img src="{{ url_for('auth.avatar', user_id=current_user.id) }}" alt=""
             style="width:100px;height:100px;object-fit:cover;border-radius:8px;display:block;margin-bottom:1rem">
        <form method="POST" action="{{ url_for('auth.change_avatar') }}" enctype="multipart/form-data">
          <div class="mb-3">
            <input type="file" name="avatar" class="form-control" accept="image/png,image/jpeg,image/webp" required>
            <div style="color:var(--text-muted);font-size:.78rem;margin-top:.35rem">PNG, JPG or WebP, up to 2 MB. Shown square.</div>
          </div>
          <button type="submit" class="btn btn-danger w-100">Upload picture</button>
        </form>
        <form method="POST" action="{{ url_for('auth.change_avatar') }}" class="mt-2">
          <button type="submit" name="remove" value="1" class="btn btn-outline-secondary w-100 btn-sm">Remove picture</button>
        </form>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-header">Change username</div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_username') }}">
          <div class="mb-4">
            <label class="form-label">New username</label>
            <input type="text" name="username" class="form-control"
                   value="{{ current_user.username }}" minlength="3" autofocus required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Update username</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Change password</div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label">Current password</label>
            <input type="password" name="current" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Update password</button>
        </form>
      </div>
    </div>

    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary w-100 mt-3">Sign out</a>

  </div>
</div>
{% endblock %}
