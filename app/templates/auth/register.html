{% extends "base.html" %}
{% block title %}Join — F1 Prode{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-5 col-lg-4">
    <h4 style="font-family:'Titillium Web',sans-serif;font-weight:700;margin-bottom:.25rem">Join F1 Prode</h4>
    <p style="color:var(--text-secondary);font-size:.875rem;margin-bottom:1.75rem">Create an account to start predicting.</p>

    <div class="card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" minlength="3" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-danger w-100">Create account</button>
        </form>
      </div>
    </div>

    <p style="text-align:center;color:var(--text-muted);font-size:.82rem;margin-top:1.25rem">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
